targets:
  $default:
    sources:
      include:
        - "$package$"
        - "lib/**"
        - "test/**"
      exclude:
        - "lib/core/network/generated/**"
    builders:
      json_serializable:
        options:
          explicit_to_json: true
          field_rename: snake
      freezed:
        options:
          union_key: type
          union_value_case: snake
